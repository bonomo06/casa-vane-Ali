<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Verificação no navegador — Vanessa &amp; Ali</title></head>
<body>
<h1 style="font-family:sans-serif;font-size:1.1rem">Verificação de ponta a ponta</h1>
<p style="font-family:sans-serif;font-size:0.85rem;color:#555;max-width:60ch">
Abra este arquivo por um servidor HTTP na raiz do projeto
(<code>python -m http.server 8765</code> e depois
<code>http://localhost:8765/tests/verificacao-navegador.html</code>).
Ele carrega o site num iframe e exercita o fluxo real. Não escreve nada no banco.</p>
<pre id="out" style="font-family:monospace;font-size:0.8rem">rodando...</pre>
<iframe id="f" src="/index.html" style="width:1200px;height:900px;border:1px solid #ccc"></iframe>
<script>
const linhas = [];
function ok(cond, msg) { linhas.push((cond ? 'PASS  ' : 'FALHA ') + msg); }
const esperar = ms => new Promise(r => setTimeout(r, ms));

function relatar(erro) {
    var partes = linhas.slice();
    if (erro) partes.push('', 'INTERROMPIDO por erro: ' + (erro && erro.stack || erro));
    partes.push('', 'RESULTADO: ' +
        linhas.filter(function (l) { return l.indexOf('PASS') === 0; }).length + ' passaram, ' +
        linhas.filter(function (l) { return l.indexOf('FALHA') === 0; }).length + ' falharam' +
        (erro ? ' (a suite parou antes do fim)' : ''));
    document.getElementById('out').textContent = partes.join(String.fromCharCode(10));
}

document.getElementById('f').addEventListener('load', async () => {
  try {
    const w = document.getElementById('f').contentWindow;
    const d = w.document;
    await esperar(3500);

    const vis = el => el && w.getComputedStyle(el).display !== 'none';

    // --- estrutura ---
    ok(d.querySelectorAll('.gift-card').length > 0, 'cartões de presente renderizados (' + d.querySelectorAll('.gift-card').length + ')');
    ok(!!d.querySelector('#sobre'), 'seção "Sobre nós" existe');
    ok(!!d.querySelector('nav a[href="#sobre"]'), 'link "Sobre nós" no menu');
    ok(d.querySelector('#sobre .sobre-remate').textContent.includes('conta na cerimônia'),
       'remate do "Sobre nós" presente');
    ok(d.querySelector('.dora-card .pet-sub').textContent.includes('com licença'),
       'texto novo da Dora');
    ok(d.querySelector('.agata-card .pet-sub').textContent.includes('brabrinha'),
       'texto novo da Ágata');
    ok(!d.body.innerHTML.includes('vanessa.ali.casamento@pix'), 'chave Pix falsa removida');

    // --- paleta e foto ---
    const forest = w.getComputedStyle(d.documentElement).getPropertyValue('--forest').trim();
    ok(forest.toLowerCase() === '#3e5732', 'verde oliva aplicado (--forest = ' + forest + ')');
    const img7 = d.querySelector('.photo-slide img[src*="vane-ali7"]');
    const pos7 = img7 ? w.getComputedStyle(img7).objectPosition : '';
    ok(pos7.startsWith('78%'), 'foto 7 reenquadrada (object-position = ' + pos7 + ')');
    const img1 = d.querySelector('.photo-slide img[src*="vane-ali1"]');
    ok(w.getComputedStyle(img1).objectPosition.startsWith('50%'), 'demais fotos intactas');

    // --- fluxo de pagamento: 2 passos ---
    const btn = d.querySelector('.present-btn');
    ok(!btn.disabled, 'botao de presentear nunca vem desabilitado');
    btn.click();
    await esperar(300);
    const modalAberto = () => d.querySelector('#giftModal').classList.contains('open');
    ok(modalAberto(), 'modal ABRE ao clicar em "Quero presentear"');
    ok(modalAberto() && vis(d.querySelector('#pagoStep1')), 'passo 1 visivel ao abrir o modal');
    ok(!vis(d.querySelector('#pagoStep2')), 'passo 2 OCULTO antes de clicar no link');
    ok(d.querySelector('#pagoStep3') === null, 'passo 3 nao existe mais no DOM');

    const link = d.querySelector('#irPagamentoBtn');
    ok(/^https:[/][/]mpago[.]la[/]/.test(link.href), 'link aponta para o Mercado Pago (' + link.href + ')');
    ok(link.target === '_blank', 'link abre em nova aba');
    link.addEventListener('click', e => e.preventDefault());
    d.querySelector('#closeModalBtn').click();
    await esperar(200);

    // Presente COM id de banco: exercita os 2 passos de verdade.
    w.abrirModalPagamento({
        id: '00000000-0000-0000-0000-000000000000',
        emoji: 'TESTE', nome: 'Presente de teste', preco: 600,
        link_pagamento: 'https://mpago.la/1rTw746'
    });
    await esperar(200);
    ok(!vis(d.querySelector('#pagoStep2')), 'com id: passo 2 OCULTO antes do clique no link');
    d.querySelector('#irPagamentoBtn').click();
    await esperar(900);
    ok(modalAberto() && vis(d.querySelector('#pagoStep2')), 'com id: passo 2 aparece DEPOIS do clique');
    ok(d.querySelector('#confirmarPagamentoBtn').textContent.indexOf('fiz o pagamento') !== -1,
       'confirmar e o proprio botao do passo 2 (sem reconfirmacao)');
    ok(d.body.textContent.indexOf('desfazer') === -1,
       'nao ha mais aviso de irreversivel, que seria falso');

    d.querySelector('#pagarDepoisBtn').click();
    await esperar(300);
    ok(!modalAberto(), '"vou fazer depois" fecha o modal');

    // --- precos e presente novo, aferidos na fonte de verdade ---
    // PRESENTES_FALLBACK e gerado por scripts/gerar_seed.py a partir da mesma
    // lista que gera o SQL, entao ele reflete o que DEVE estar no ar.
    const esperados = w.PRESENTES_FALLBACK;
    const porNome = t => esperados.find(p => p.nome.indexOf(t) !== -1);
    ok(esperados.length === 16, 'a lista de origem tem 16 presentes (' + esperados.length + ')');
    ok((porNome('fila do bar') || {}).preco === 1000, 'fila do bar: R$ 1.000');
    ok((porNome('no repert') || {}).preco === 1200, 'musica na banda: R$ 1.200');
    ok((porNome('Jantar no ap') || {}).preco === 1500, 'Jantar no ape: R$ 1.500');
    ok((porNome('Jantar no ap') || {}).link_pagamento === 'https://mpago.la/1r2Wf66',
       'Jantar no ape usa o link de R$ 1.500');

    // O site le do Supabase. Se o banco estiver com um seed antigo, os cartoes
    // divergem da lista de origem — e isso e um passo de deploy pendente, nao um
    // bug de codigo, por isso e reportado separadamente.
    const cartoes = d.querySelectorAll('.gift-card').length;
    if (cartoes !== esperados.length) {
        linhas.push('DESSINCRONIZADO  o banco serve ' + cartoes + ' presentes, mas a lista de ' +
                    'origem tem ' + esperados.length + '. Rode sql/03_seed_presentes.sql no Supabase.');
    } else {
        ok(true, 'banco em sincronia com a lista de origem (' + cartoes + ' presentes)');
    }

    // --- nenhum cartao revela quem ja foi presenteado ---
    // O site parou de mostrar isso: os noivos consultam a coluna `pagou` no
    // Supabase, o convidado nao ve nada. Estas checagens existem para o selo
    // nao voltar por acidente junto com algum refactor do render.
    const qualquer = esperados[0];
    w.renderizarPresentes('todos');
    await esperar(150);
    ok(d.querySelectorAll('.gift-card.presenteado').length === 0,
       'nenhum cartao recebe a classe de "ja presenteado"');
    ok(d.querySelectorAll('.gift-badge-dado').length === 0,
       'o selo de "ja presenteado" nao existe mais em cartao nenhum');
    const textosBotoes = Array.prototype.map.call(
        d.querySelectorAll('.present-btn'), b => b.textContent.trim());
    ok(textosBotoes.every(t => t === 'Quero presentear'),
       'todo botao diz "Quero presentear", sem variante para presente ja dado');

    // A ordem tem de ser a da lista de origem: nada reordena por `pagou`.
    const nomesNaTela = Array.prototype.map.call(
        d.querySelectorAll('.gift-card .gift-title'), e => e.textContent.trim());
    ok(nomesNaTela.length === esperados.length &&
       nomesNaTela.every((n, i) => n === esperados[i].nome),
       'cartoes saem na ordem da lista de origem, sem empurrar os pagos para o fim');

    // Nenhum cartao pode vir desabilitado.
    const desabilitados = Array.prototype.filter.call(
        d.querySelectorAll('.present-btn'), b => b.disabled).length;
    ok(desabilitados === 0, 'nenhum botao de presentear esta desabilitado (' + desabilitados + ')');
    ok(qualquer && qualquer.pagou === false, 'a lista de origem nasce toda com pagou = false');

    // --- os tres presentes com contrapartida pedem contato ---
    // Sem enviar nada para o n8n: o teste para no passo de validacao, que
    // acontece antes do fetch.
    const PERKS_ESPERADOS = [
        ['Jantar no apê', 'ape', false],
        ['Escolher uma música no repertório da banda', 'musica', true],
        ['Preferência na fila do bar', 'bar', false]
    ];
    for (const [nome, tipo, pedeMusica] of PERKS_ESPERADOS) {
        const perk = w.WeddingHelpers.perkDoPresente(nome);
        ok(perk && perk.tipo === tipo, '"' + nome + '" e reconhecido como perk do tipo ' + tipo);
        ok(perk && perk.pedeMusica === pedeMusica,
           '"' + nome + '" ' + (pedeMusica ? 'pede' : 'nao pede') + ' o campo de musica');
        ok(!!esperados.find(p => p.nome === nome),
           '"' + nome + '" existe na lista de origem (nome que liga o perk ao presente)');
    }
    ok(w.WeddingHelpers.perkDoPresente('Cota do sofá') === null,
       'presente comum nao e tratado como perk');

    // Abre um perk e confere que o formulario aparece no passo 2.
    const cartaoMusica = Array.prototype.find.call(
        d.querySelectorAll('.gift-card'),
        c => c.querySelector('.gift-title').textContent.indexOf('Escolher uma m') !== -1);
    if (!cartaoMusica) {
        linhas.push('PULADO  cartao "Escolher uma musica" nao esta na tela');
    } else {
        cartaoMusica.querySelector('.present-btn').click();
        await esperar(300);
        ok(d.querySelector('#perkForm').style.display === 'block',
           'o formulario de contato aparece no presente da musica');
        ok(d.querySelector('#perkMusicaWrap').style.display === 'block',
           'o campo "qual musica" aparece so nesse presente');
        d.querySelector('#irPagamentoBtn').click();
        await esperar(800);
        ok(d.querySelector('#pagoStep2').style.display === 'block',
           'o passo 2 abre para o perk (mesmo sem banco, o webhook nao depende dele)');

        // Nome vazio: precisa reclamar e NAO fechar o modal.
        d.querySelector('#perkNome').value = '';
        d.querySelector('#confirmarPagamentoBtn').click();
        await esperar(200);
        ok(d.querySelector('#perkErro').textContent.length > 0, 'sem nome, mostra erro');
        ok(modalAberto(), 'sem nome, o modal continua aberto');

        // Telefone invalido: mesma coisa.
        d.querySelector('#perkNome').value = 'Convidado de Teste';
        d.querySelector('#perkTelefone').value = '123';
        d.querySelector('#confirmarPagamentoBtn').click();
        await esperar(200);
        ok(d.querySelector('#perkErro').textContent.indexOf('DDD') !== -1,
           'telefone curto reclama do DDD');
        ok(modalAberto(), 'telefone invalido nao fecha o modal');

        // Musica vazia, com nome e telefone certos.
        d.querySelector('#perkTelefone').value = '(11) 91234-5678';
        d.querySelector('#perkMusica').value = '';
        d.querySelector('#confirmarPagamentoBtn').click();
        await esperar(200);
        ok(d.querySelector('#perkErro').textContent.toLowerCase().indexOf('m') !== -1 &&
           modalAberto(), 'sem a musica, reclama e nao envia');

        d.querySelector('#pagarDepoisBtn').click();
        await esperar(300);
    }

    // Presente comum nao mostra o formulario.
    const cartaoComum = Array.prototype.find.call(
        d.querySelectorAll('.gift-card'),
        c => c.querySelector('.gift-title').textContent.indexOf('Cota do sof') !== -1);
    if (cartaoComum) {
        cartaoComum.querySelector('.present-btn').click();
        await esperar(300);
        ok(d.querySelector('#perkForm').style.display === 'none',
           'presente comum nao pede contato nenhum');
        d.querySelector('#closeModalBtn').click();
        await esperar(200);
    }

    // --- valor livre ---
    const campo = d.querySelector('#freeValue');
    campo.value = '320';
    campo.dispatchEvent(new w.Event('input'));
    await esperar(150);
    ok(d.querySelector('#avisoValorLivre').textContent.includes('300'),
       'valor livre 320 sugere R$ 300 ("' + d.querySelector('#avisoValorLivre').textContent + '")');
    campo.value = '175';
    campo.dispatchEvent(new w.Event('input'));
    await esperar(150);
    ok(d.querySelector('#avisoValorLivre').textContent.includes('150'), 'empate 175 resolve para R$ 150');
    campo.value = '300';
    campo.dispatchEvent(new w.Event('input'));
    await esperar(150);
    ok(d.querySelector('#avisoValorLivre').textContent === '', 'valor exato não mostra aviso');

    // --- clientes ---
    ok(w.WeddingDB.disponivel(), 'cliente Supabase inicializado (presentes e recados)');
    ok(typeof w.WeddingDB.listarConvidados === 'undefined',
       'WeddingDB não expõe mais convidados (fonte agora é a planilha)');
    ok(typeof w.WeddingSheets === 'object', 'cliente da planilha carregado');

    // --- planilha do Google ---
    if (!w.WeddingSheets.configurado()) {
        // Diagnóstico acionável em vez de um "pulado" mudo.
        linhas.push('PULADO checagens da planilha não rodaram — URL_APPS_SCRIPT está ' +
                    '"' + w.WeddingSheets.estadoDaUrl() + '" (veja js/sheets-client.js)');

        // Mesmo sem a planilha, o convidado não pode ver mensagem enganosa.
        d.querySelector('#openRsvpModalBtn').click();
        await esperar(1200);
        const aviso = d.querySelector('#guestResults').textContent;
        ok(aviso.includes('fora do ar'),
           'sem URL configurada, o convidado vê "fora do ar" e não "tente de novo"');
        ok(!aviso.includes('Tenta de novo'),
           'não promete uma nova tentativa que nunca vai funcionar');
        ok(aviso.includes('WhatsApp'), 'oferece uma saída ao convidado (WhatsApp)');
        d.querySelector('#closeRsvpModalBtn').click();
        await esperar(200);
    } else {
        const convidados = await w.WeddingSheets.listarConvidados();
        ok(Array.isArray(convidados), 'planilha respondeu a leitura (' +
           (convidados ? convidados.length + ' convidados' : 'ERRO') + ')');
        if (Array.isArray(convidados)) {
            ok(convidados.length > 100, 'lista tem mais de 100 convidados');
            ok(convidados.every(c => c.nome && typeof c.nome === 'string'),
               'todo convidado tem nome preenchido');
            ok(!convidados.some(c => /^banda\s*\d+$/i.test(c.nome)),
               'placeholders "banda N" ficam fora da lista');
            ok(convidados.some(c => c.nome === 'namorada Renato'),
               '"namorada Renato" aparece na lista');
            ok(convidados.some(c => c.nome === 'Ogney'), '"Ogney" aparece na lista');
            ok(convidados.every(c => c.confirmacao === null ||
                                     c.confirmacao === 'pago' ||
                                     c.confirmacao === 'recusado'),
               'confirmacao só assume null, "pago" ou "recusado"');
            // Busca sem acento sobre os dados reais da planilha.
            const achados = w.WeddingHelpers.buscarConvidados(convidados, 'goncalves');
            ok(achados.length >= 1, 'busca por "goncalves" acha nome com cedilha na planilha');
        }
    }

    relatar(null);
  } catch (erro) {
    // Sem isto, uma exceção deixava o relatório preso em "rodando..." sem dizer
    // onde parou — o pior tipo de falha num harness de teste.
    relatar(erro);
  }
});
</script>
</body>
</html>
